[project]
name = "multimodal-ai-agent"
version = "0.1.0"
description = "A research-oriented multimodal AI agent with controlled tool execution and verification."
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "Pillow",
    "sentence-transformers>=6.2.0,<7.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"